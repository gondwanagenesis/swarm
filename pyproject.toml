[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm"
version = "0.1.0"
description = "Heterogeneous compute pool over opportunistic hardware. Currency: honest measurement."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
swarm-hub = "swarm.hub.server:main"
swarm-agent = "swarm.agent.daemon:main"
swarm = "swarm.cli:main"

[tool.setuptools.packages.find]
include = ["swarm*"]

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF", "W"]
ignore = ["E501", "RUF059"]

[tool.ruff.lint.per-file-ignores]
"swarm/probe/**" = []
"swarm/bench/**" = []
"swarm/agent/**" = []
"swarm/transport/**" = []
"tests/**" = ["E402"]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests that start real hub/agent processes (run in CI; skipped inside workshop sandboxes)",
]
