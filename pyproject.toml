[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm"
version = "0.1.0"
description = "Heterogeneous compute pool over opportunistic hardware. Currency: honest measurement."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
swarm-hub = "swarm.hub.server:main"
swarm-agent = "swarm.agent.daemon:main"

[tool.setuptools.packages.find]
include = ["swarm*"]
